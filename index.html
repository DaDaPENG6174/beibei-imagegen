<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贝贝生图</title>
<style>
  :root{
    --gold:#b8925a; --gold-lt:#d8bd8e; --gold-dk:#8d6b3c;
    --ink:#1d1c1a; --ink-2:#5a564f; --ink-3:#8f8a81;
    --line:#e8e3da; --bg:#faf8f5; --card:#fff;
    --ok:#3f8f5c; --err:#b8423a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  button{font-family:inherit}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.72); backdrop-filter:blur(12px);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:12px}
  .seal{
    width:34px; height:34px; border-radius:8px; flex:0 0 auto;
    background:linear-gradient(145deg,var(--gold-lt),var(--gold) 55%,var(--gold-dk));
    display:grid; place-items:center; color:#fff; font-size:17px; font-weight:700;
    box-shadow:0 2px 8px rgba(184,146,90,.35), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .brand h1{font-size:16px; font-weight:600; letter-spacing:.02em}
  .brand .sub{font-size:11.5px; color:var(--ink-3); letter-spacing:.14em; margin-top:2px}
  .status{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2)}
  .dot{width:7px; height:7px; border-radius:50%; background:#c9c3b7; flex:0 0 auto}
  .dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(63,143,92,.14)}
  .dot.err{background:var(--err); box-shadow:0 0 0 3px rgba(184,66,58,.14)}
  .dot.wait{background:var(--gold); animation:pulse 1.3s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .status button{
    background:none; border:none; color:var(--gold-dk); font-size:12.5px;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:2px 4px;
  }

  main{
    flex:1; width:100%; max-width:1480px; margin:0 auto;
    padding:30px 32px 48px;
    display:grid; grid-template-columns:340px minmax(0,1fr);
    gap:24px; align-items:start;
  }
  @media(max-width:980px){ main{grid-template-columns:1fr; padding:22px 18px 40px} header{padding:14px 18px} }

  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px; box-shadow:0 1px 2px rgba(29,28,26,.04), 0 8px 24px -18px rgba(29,28,26,.3);
  }
  .panel-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px}
  .panel-head h2{font-size:14px; font-weight:600; letter-spacing:.04em}
  .panel-head .num{
    font-size:10.5px; color:var(--gold-dk); letter-spacing:.16em; font-weight:600;
    padding:3px 7px; border:1px solid rgba(184,146,90,.4); border-radius:4px;
  }

  /* 上传 */
  .drop{
    position:relative; border:1.5px dashed #ddd5c6; border-radius:12px;
    background:#fdfcfa; aspect-ratio:1/1;
    display:grid; place-items:center; cursor:pointer;
    transition:border-color .18s, background .18s; overflow:hidden;
  }
  .drop:hover{border-color:var(--gold-lt); background:#fffdfa}
  .drop.dragover{border-color:var(--gold); background:#fffaf1}
  .drop.has{border-style:solid; border-color:var(--line); background:#fff; cursor:default}
  .drop-inner{text-align:center; padding:24px 18px; pointer-events:none}
  .drop-icon{
    width:46px; height:46px; margin:0 auto 14px; border-radius:12px;
    background:linear-gradient(150deg,#fff8ec,#f5ead6);
    display:grid; place-items:center; border:1px solid rgba(184,146,90,.22);
  }
  .drop-icon svg{width:22px; height:22px; stroke:var(--gold-dk); fill:none; stroke-width:1.5}
  .drop-title{font-size:13.5px; font-weight:500; margin-bottom:5px}
  .drop-hint{font-size:12px; color:var(--ink-3); line-height:1.7}
  .drop img{width:100%; height:100%; object-fit:contain; display:block; padding:12px}
  .clear-btn{
    position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%;
    border:1px solid var(--line); background:rgba(255,255,255,.94);
    color:var(--ink-2); font-size:15px; line-height:1; cursor:pointer;
    display:grid; place-items:center; z-index:3;
  }
  .clear-btn:hover{color:var(--err); border-color:#e6c9c5}
  .filemeta{display:flex; justify-content:space-between; margin-top:10px; font-size:11.5px; color:var(--ink-3)}

  .style-card{
    display:flex; align-items:center; gap:12px;
    border:1px solid rgba(184,146,90,.3); border-radius:11px;
    background:linear-gradient(180deg,#fffdf8,#fdf8ee); padding:13px 14px;
  }
  .style-swatch{
    width:38px; height:38px; border-radius:8px; flex:0 0 auto; background:#fff;
    border:1px solid #eee6d8; box-shadow:inset 0 -6px 10px -8px rgba(0,0,0,.16);
    position:relative; overflow:hidden;
  }
  .style-swatch::after{
    content:""; position:absolute; left:10px; right:10px; bottom:8px; height:9px;
    border-radius:50% 50% 46% 46%;
    background:radial-gradient(ellipse at 50% 30%,#e7c483,#c9a163 60%,#a37f45);
  }
  .style-name{font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .style-name .lock{
    font-size:9.5px; font-weight:600; letter-spacing:.1em; color:var(--gold-dk);
    border:1px solid rgba(184,146,90,.45); border-radius:3px; padding:1.5px 4px;
  }
  .style-desc{font-size:11.5px; color:var(--ink-3); margin-top:3px; line-height:1.6}

  .gen{
    width:100%; border:none; border-radius:11px; padding:15px 22px; margin-top:20px;
    background:linear-gradient(140deg,#c9a468,var(--gold) 48%,var(--gold-dk));
    color:#fff; font-size:14px; font-weight:600; letter-spacing:.06em; cursor:pointer;
    box-shadow:0 6px 18px -8px rgba(141,107,60,.75), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .12s, filter .18s;
  }
  .gen:hover:not(:disabled){transform:translateY(-1px)}
  .gen:disabled{cursor:not-allowed; filter:grayscale(.35) brightness(.97); opacity:.72}
  .gen-note{text-align:center; font-size:11.5px; color:var(--ink-3); margin-top:10px; min-height:16px; line-height:1.6}
  .err-box{
    margin-top:14px; border:1px solid #efd6d3; border-left:3px solid var(--err);
    background:#fdf6f5; border-radius:9px; padding:12px 14px;
    font-size:12px; color:#8d3b34; line-height:1.65; display:none; word-break:break-word; white-space:pre-wrap;
  }
  .err-box.show{display:block}

  /* 六视图 */
  .views-tools{display:flex; gap:8px}
  .tool-btn{
    background:#fff; border:1px solid var(--line); color:var(--ink-2); border-radius:8px;
    padding:6px 12px; font-size:12px; cursor:pointer;
  }
  .tool-btn:hover:not(:disabled){border-color:var(--gold-lt); color:var(--gold-dk)}
  .tool-btn:disabled{opacity:.45; cursor:not-allowed}
  .grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
  @media(max-width:1200px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media(max-width:560px){ .grid{grid-template-columns:1fr} }

  .vcard{border:1px solid var(--line); border-radius:13px; background:#fff; padding:12px; display:flex; flex-direction:column; gap:10px}
  .vhead{display:flex; align-items:baseline; justify-content:space-between}
  .vname{font-size:13px; font-weight:600}
  .vname small{font-weight:400; color:var(--ink-3); font-size:10.5px; letter-spacing:.08em; margin-left:6px}
  .vbox{
    position:relative; aspect-ratio:2/3; border-radius:9px; border:1px dashed #e2ddd3;
    background:#fbfaf8; overflow:hidden; display:grid; place-items:center;
  }
  .vbox.has{border:1px solid var(--line); background:#fff}
  .vbox img{width:100%; height:100%; object-fit:contain; display:block}
  .vph{font-size:11.5px; color:var(--ink-3); text-align:center; padding:12px; line-height:1.6}
  .vbusy{
    position:absolute; inset:0; background:rgba(255,255,255,.88);
    display:none; place-items:center; text-align:center;
  }
  .vbox.busy .vbusy{display:grid}
  .vspin{
    width:26px; height:26px; border-radius:50%; margin:0 auto 10px;
    border:2.5px solid rgba(184,146,90,.22); border-top-color:var(--gold); animation:rot .8s linear infinite;
  }
  @keyframes rot{to{transform:rotate(360deg)}}
  .vbusy .t{font-size:12px; color:var(--ink-2)}
  .vbusy .s{font-size:11px; color:var(--ink-3); margin-top:3px; font-variant-numeric:tabular-nums}
  .verr{font-size:11.5px; color:#8d3b34; background:#fdf6f5; border-left:3px solid var(--err); border-radius:6px; padding:7px 9px; line-height:1.55; display:none; word-break:break-word}
  .verr.show{display:block}
  .vers{display:flex; flex-wrap:wrap; gap:6px; min-height:26px; align-items:center}
  .vers .lbl{font-size:11px; color:var(--ink-3)}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--ink-2); border-radius:6px;
    padding:3px 9px; font-size:11.5px; cursor:pointer;
  }
  .chip:hover{border-color:var(--gold-lt)}
  .chip.on{background:var(--gold); border-color:var(--gold); color:#fff}
  .vact{display:flex; gap:8px}
  .vact button{
    flex:1; padding:8px 10px; border-radius:8px; font-size:12px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink-2);
  }
  .vact button:hover:not(:disabled){border-color:var(--gold-lt); color:var(--gold-dk)}
  .vact button:disabled{opacity:.45; cursor:not-allowed}
  .vact .redo{background:var(--ink); border-color:var(--ink); color:#fff}
  .vact .redo:hover:not(:disabled){background:#000; color:#fff; border-color:#000}

  .seg{display:flex; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff}
  .seg button{
    flex:1; padding:10px 8px; border:none; background:#fff; color:var(--ink-2);
    font-size:13px; cursor:pointer; line-height:1.35; border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none}
  .seg button small{display:block; font-size:10.5px; color:var(--ink-3); margin-top:2px}
  .seg button.on{background:linear-gradient(140deg,#c9a468,var(--gold) 48%,var(--gold-dk)); color:#fff; font-weight:600}
  .seg button.on small{color:rgba(255,255,255,.85)}
  .seg button:disabled{cursor:not-allowed; opacity:.6}
  .seg-note{font-size:11.5px; color:var(--ink-3); margin-top:8px; line-height:1.6}

  .spec-wrap{margin-top:18px}
  .spec-wrap label{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-2); margin-bottom:6px}
  .spec-wrap label span{color:var(--ink-3); font-size:11px}
  .spec-wrap textarea{
    width:100%; height:150px; resize:vertical; border:1px solid var(--line); border-radius:9px;
    padding:9px 10px; font-size:11.5px; line-height:1.6; font-family:inherit; color:var(--ink-2); background:#fdfcfa;
  }
  .spec-wrap textarea:focus{outline:none; border-color:var(--gold-lt)}
  .vqa{font-size:11.5px; line-height:1.55; border-radius:6px; padding:6px 9px; display:none}
  .vqa.show{display:block}
  .vqa.ok{background:#f1f8f3; color:#2f6e47}
  .vqa.warn{background:#fff7e8; color:#8a5a12; border-left:3px solid #e0a43a}
  .vqa.wait{background:#f6f4ef; color:var(--ink-3)}
  .chip.warn::after{content:" ⚠"; color:#e0a43a}
  .chip.on.warn::after{color:#fff}
  footer{text-align:center; padding:0 0 26px; font-size:11px; color:var(--ink-3); letter-spacing:.05em}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="seal">贝</div>
    <div>
      <h1>贝贝生图</h1>
      <div class="sub">BEIBEI IMAGE · 三视图 / 六视图</div>
    </div>
  </div>
  <div class="status">
    <span class="dot wait" id="dot"></span>
    <span id="statusText">正在连接…</span>
    <button id="retryStatus" style="display:none">重试</button>
  </div>
</header>

<main>
  <!-- 左：上传 -->
  <section class="panel">
    <div class="panel-head"><h2>参考图片</h2><span class="num">01</span></div>
    <div class="drop" id="drop">
      <div class="drop-inner" id="dropInner">
        <div class="drop-icon">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/>
          </svg>
        </div>
        <div class="drop-title">拖入、点击或粘贴一张随手拍</div>
        <div class="drop-hint">JPG / PNG / WEBP<br>一张就够，拍清楚主体即可</div>
      </div>
      <button class="clear-btn" id="clearBtn" style="display:none" title="移除">&times;</button>
    </div>
    <div class="filemeta"><span id="fileName"></span><span id="fileInfo"></span></div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <div class="panel-head" style="margin-top:22px"><h2>出图数量</h2><span class="num">02</span></div>
    <div class="seg" id="seg">
      <button type="button" data-mode="3">三视图<small>前 · 后 · 左</small></button>
      <button type="button" data-mode="6" class="on">六视图<small>前 · 后 · 左 · 右 · 左后 · 右后</small></button>
    </div>
    <div class="seg-note" id="segNote"></div>

    <div class="panel-head" style="margin-top:22px"><h2>画面风格</h2><span class="num">03</span></div>
    <div class="style-card">
      <div class="style-swatch"></div>
      <div>
        <div class="style-name">暖白渐变 <span class="lock">固定</span></div>
        <div class="style-desc">暖象牙渐变背景，柔光，产品轻盈悬浮；每张各自独立生成</div>
      </div>
    </div>

    <div class="spec-wrap">
      <label>产品档案 <span id="specState">上传后自动提取</span></label>
      <textarea id="spec" placeholder="系统会先看图写出这件产品的结构、数量、花纹等事实，之后每张图都按它生成。发现写错的地方可以直接改。"></textarea>
    </div>

    <button class="gen" id="genAll" disabled>生成六视图</button>
    <div class="gen-note" id="genNote">请先上传一张饰品图片</div>
    <div class="err-box" id="errBox"></div>
  </section>

  <!-- 右：六视图 -->
  <section class="panel">
    <div class="panel-head">
      <h2 id="viewsTitle">六视图</h2>
      <div class="views-tools">
        <button class="tool-btn" id="dlAll" disabled>下载全部当前版本</button>
        <span class="num">03</span>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>贝贝生图 · 三视图约 40 秒，六视图约 1 分钟 · 不满意的视图可单独重生成，历史版本随时切换</footer>

<script>
(function(){
  "use strict";

  var API = "";
  var MAX_SIDE = 2048;
  var SIZE = "1024x1536";        // 六张统一竖版 2:3，对应参考风格的竖版海报
  var CONCURRENCY = 3;           // 同时生成几张

  // ---------- 固定提示词：公共部分（客户看不到、改不了） ----------
  var PROMPT = [
    "Use the uploaded photo as the only reference for the jewelry piece.",
    "Keep the item's exact shape, proportions, size relationships, gemstone positions and counts,",
    "metal color and karat appearance, engraving, texture, chain link pattern and every physical detail unchanged.",
    "Do not redesign, restyle, simplify, embellish or add any element that is not in the original.",

    "Completely remove the original background, hands, stands, props, cloth, reflections, mirrors and scene lighting.",

    "Style: premium luxury gold jewelry brand campaign photography, vertical 3:4 poster composition.",
    "Background: a seamless, perfectly smooth vertical gradient with no texture and no horizon line.",
    "The top is a warm ivory white (about #FDFBF6), softly and gradually deepening downward to a pale warm beige (about #EAE3D7) at the bottom,",
    "with a very subtle soft vignette at the corners and left/right edges.",
    "Clean, airy, calm, quiet-luxury atmosphere. No props, no scenery, no patterns, no floor line.",

    "Lighting: very large soft diffused light from above and slightly in front, low contrast, even and gentle.",
    "No hard shadows, no hotspots. The item appears to float lightly in the air,",
    "with only a very faint, soft, wide contact shadow or soft tonal falloff beneath it, never a long cast shadow.",

    "Gold rendering: rich saturated warm yellow gold color, satin-matte finish with soft, smooth continuous highlights that follow the form,",
    "warm glow and gentle bounce reflections on inner surfaces; premium clean 3D-render-like quality that is still photorealistic metal,",
    "no plastic look, no blown-out white clipping, no color cast. If the item has gemstones, keep their facets clear without glare.",

    "Rendering: ultra sharp, fine detail, crisp clean anti-aliased edges, no halo, no cutout fringe, no leftover background fragments.",

    "Framing: vertical portrait frame, the item centered horizontally and placed in the lower third of the frame,",
    "occupying about 60 to 65 percent of the frame width, ample empty negative space in the upper half, nothing cropped or touching the edge.",

    "Do not include: text, watermark, logo, border, frame, extra jewelry, duplicate items, hands, mannequins,",
    "props, furniture, floor reflections, harsh shadows, a flat pure #FFFFFF background, or any object other than the item itself."
  ].join(" ");

  // 单张视图的公共前置说明
  var VIEW_INTRO = [
    "TASK: produce ONE single product photograph of this exact jewelry piece from a specific camera angle.",
    "Output exactly one item in one image, never a collage, never several angles in one picture.",
    "The reference photo may show only one side. Infer the hidden sides conservatively and consistently:",
    "same design language, same metal, same stones, same proportions and thickness, no new decoration."
  ].join(" ");

  // ---------- 六个视图：每一张单独的提示词 ----------
  var VIEWS = [
    { key:"front", name:"前视图", en:"FRONT",
      prompt:[
        "VIEW: FRONT view. The camera is directly in front of the item, at the item's mid-height, perfectly level, no tilt, no perspective skew.",
        "The item's front face points straight at the camera and is perfectly symmetric in the frame.",
        "Show the main face of the piece, i.e. the side the customer sees first, with full detail on it.",
        "Keep the item upright in its natural wearing or display orientation."
      ].join(" ") },
    { key:"back", name:"后视图", en:"BACK",
      prompt:[
        "VIEW: BACK view. The item is rotated exactly 180 degrees from the front view; the camera is directly behind it,",
        "level, at mid-height, no tilt. Show the reverse side exactly as it would physically look:",
        "the back of the setting, the clasp, bail, pin, hook or closure, the underside of the stones.",
        "If the back is not visible in the reference, build it plausibly and simply from the front design (smooth polished metal back),",
        "do not mirror the front face. Keep the item upright."
      ].join(" ") },
    { key:"left", name:"左视图", en:"LEFT",
      prompt:[
        "VIEW: LEFT side view (pure profile). The item is rotated exactly 90 degrees so the camera sees its LEFT side:",
        "the camera is at the item's left, level, at mid-height, looking straight across at the left profile.",
        "This is a true side elevation: the front face of the piece appears edge-on at the right side of the image,",
        "showing thickness, height of the stones above the metal, depth and the side silhouette.",
        "Keep the item upright."
      ].join(" ") },
    { key:"right", name:"右视图", en:"RIGHT",
      prompt:[
        "VIEW: RIGHT side view (pure profile). The item is rotated exactly 90 degrees so the camera sees its RIGHT side:",
        "the camera is at the item's right, level, at mid-height, looking straight across at the right profile.",
        "This is a true side elevation: the front face of the piece appears edge-on at the left side of the image,",
        "showing thickness, height of the stones above the metal, depth and the side silhouette.",
        "It must be consistent with the left side of the same piece. Keep the item upright."
      ].join(" ") },
    { key:"leftrear", name:"左后视图", en:"LEFT-REAR",
      prompt:[
        "VIEW: LEFT-REAR three-quarter view. The camera is at 45 degrees between the item's left side and its back,",
        "slightly behind the item on its left, level with mid-height, no looking down.",
        "The back face and the left side are both visible at the same time, the front face is hidden.",
        "Show the back structure, closure and side depth together. Keep the item upright."
      ].join(" ") },
    { key:"rightrear", name:"右后视图", en:"RIGHT-REAR",
      prompt:[
        "VIEW: RIGHT-REAR three-quarter view. The camera is at 45 degrees between the item's right side and its back,",
        "slightly behind the item on its right, level with mid-height, no looking down.",
        "The back face and the right side are both visible at the same time, the front face is hidden.",
        "Show the back structure, closure and side depth together. Keep the item upright."
      ].join(" ") }
  ];

  // 参考图角色说明：防止模型把「已确认的前视图」的角度、背景照抄过来
  var ROLE_ONE = "Image 1 is the AUTHORITATIVE reference photo of the product.";
  var ROLE_TWO = "Image 1 is the AUTHORITATIVE reference photo of the product. Image 2 is the already approved FRONT view of the same product: use it ONLY to keep the design, proportions, pattern and color identical; do NOT copy its camera angle, framing or background.";
  var SPEC_HEAD = "PRODUCT FACT SHEET (authoritative, never contradict it; counts and patterns must match exactly; do not invent anything that is not listed):";

  function buildPrompt(v, hasAnchor){
    var spec = ($("spec").value || "").trim();
    return (hasAnchor ? ROLE_TWO : ROLE_ONE) + " " +
           (spec ? SPEC_HEAD + " " + spec.replace(/\s*\n\s*/g, " ") + " " : "") +
           VIEW_INTRO + " " + v.prompt + " " + PROMPT;
  }

  var $ = function(id){ return document.getElementById(id); };
  var drop=$("drop"), dropInner=$("dropInner"), fileInput=$("fileInput"), clearBtn=$("clearBtn"),
      fileName=$("fileName"), fileInfo=$("fileInfo"), genAll=$("genAll"), genNote=$("genNote"),
      errBox=$("errBox"), grid=$("grid"), dlAll=$("dlAll"),
      dot=$("dot"), statusText=$("statusText"), retryStatus=$("retryStatus");

  var state = { file:null, dataUrl:null };

  // ---------- 六张卡片 ----------
  VIEWS.forEach(function(v){
    v.versions = [];   // 每次生成的图（data URL）
    v.qas = [];        // 与 versions 一一对应的质检结果 {state:"wait|ok|warn|na", issues:[]}
    v.cur = -1;        // 当前显示第几个版本
    v.busy = false;
    v.timer = null;
    v.el = buildCard(v);
  });

  function buildCard(v){
    var card = document.createElement("div");
    card.className = "vcard";
    card.innerHTML =
      '<div class="vhead"><div class="vname">' + v.name + '<small>' + v.en + '</small></div></div>' +
      '<div class="vbox"><div class="vph">尚未生成</div>' +
        '<div class="vbusy"><div><div class="vspin"></div><div class="t">正在生成…</div><div class="s">0.0 秒</div></div></div></div>' +
      '<div class="verr"></div>' +
      '<div class="vqa"></div>' +
      '<div class="vers"></div>' +
      '<div class="vact"><button class="redo" disabled>生成这一张</button><button class="dl" disabled>下载</button></div>';
    grid.appendChild(card);
    var o = {
      card: card,
      box: card.querySelector(".vbox"),
      ph: card.querySelector(".vph"),
      secs: card.querySelector(".vbusy .s"),
      err: card.querySelector(".verr"),
      qa: card.querySelector(".vqa"),
      vers: card.querySelector(".vers"),
      redo: card.querySelector(".redo"),
      dl: card.querySelector(".dl")
    };
    o.redo.addEventListener("click", function(){ generateView(v); });
    o.dl.addEventListener("click", function(){ downloadView(v); });
    return o;
  }

  function render(v){
    var e = v.el, url = v.cur >= 0 ? v.versions[v.cur] : null;
    var im = e.box.querySelector("img");
    if(url){
      if(!im){ im = document.createElement("img"); im.alt = v.name; e.box.insertBefore(im, e.box.firstChild); }
      if(im.getAttribute("src") !== url) im.src = url;
      e.ph.style.display = "none";
      e.box.classList.add("has");
    }else{
      if(im) im.remove();
      e.ph.style.display = "";
      e.box.classList.remove("has");
    }
    e.box.classList.toggle("busy", v.busy);

    // 版本切换按钮：第1次、第2次、第3次…
    e.vers.innerHTML = "";
    if(v.versions.length){
      var lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "版本";
      e.vers.appendChild(lbl);
      v.versions.forEach(function(_, i){
        var b = document.createElement("button");
        var q = v.qas[i];
        b.className = "chip" + (i === v.cur ? " on" : "") + (q && q.state === "warn" ? " warn" : "");
        b.textContent = "第" + (i+1) + "次";
        b.addEventListener("click", function(){ v.cur = i; render(v); });
        e.vers.appendChild(b);
      });
    }

    var q2 = v.cur >= 0 ? v.qas[v.cur] : null;
    e.qa.className = "vqa";
    if(q2 && q2.state === "wait"){ e.qa.className = "vqa show wait"; e.qa.textContent = "正在对照原图质检…"; }
    else if(q2 && q2.state === "ok"){ e.qa.className = "vqa show ok"; e.qa.textContent = "✓ 与原图设计一致"; }
    else if(q2 && q2.state === "warn"){ e.qa.className = "vqa show warn"; e.qa.textContent = "⚠ 疑似与原图不符：" + q2.issues.join("；") + "。可重新生成这一张。"; }
    else if(q2 && q2.state === "na"){ e.qa.className = "vqa show wait"; e.qa.textContent = "质检未完成，请人工对照原图"; }

    e.redo.disabled = v.busy || !state.dataUrl;
    e.redo.textContent = v.versions.length ? "重新生成这一张" : "生成这一张";
    e.dl.disabled = !url;
    refreshGlobal();
  }

  function setViewErr(v, msg){
    v.el.err.textContent = msg || "";
    v.el.err.classList.toggle("show", !!msg);
  }

  // ---------- 三视图 / 六视图 ----------
  // 三视图：前 · 后 · 左（正面、背面、侧面，覆盖产品的基本信息）
  // 六视图：前 · 后 · 左 · 右 · 左后 · 右后（补全对侧和斜后方）
  var MODES = {
    3: { label:"三视图", cn:"三", keys:["front","back","left"],
         note:"前 · 后 · 左，共 3 张，约 40 秒。适合结构简单、左右对称的款式。" },
    6: { label:"六视图", cn:"六", keys:["front","back","left","right","leftrear","rightrear"],
         note:"前 · 后 · 左 · 右 · 左后 · 右后，共 6 张，约 1 分钟。适合左右不对称或背面复杂的款式。" }
  };
  var mode = 6;

  function isActive(v){ return MODES[mode].keys.indexOf(v.key) >= 0; }
  function activeViews(){ return VIEWS.filter(isActive); }

  function applyMode(){
    VIEWS.forEach(function(v){ v.el.card.style.display = isActive(v) ? "" : "none"; });
    Array.prototype.forEach.call($("seg").querySelectorAll("button"), function(b){
      b.classList.toggle("on", +b.getAttribute("data-mode") === mode);
    });
    $("viewsTitle").textContent = MODES[mode].label;
    $("segNote").textContent = MODES[mode].note;
    if(!VIEWS.some(function(v){ return v.busy; })){
      genNote.textContent = state.dataUrl ? ("图片已就绪，点「生成" + MODES[mode].label + "」") : "请先上传一张饰品图片";
    }
    refreshGlobal();
  }

  function refreshGlobal(){
    var anyBusy = VIEWS.some(function(v){ return v.busy; });
    var anyImg  = activeViews().some(function(v){ return v.cur >= 0; });
    genAll.disabled = anyBusy || !state.dataUrl;
    genAll.textContent = anyBusy ? "生成中…" :
      (anyImg ? "重新生成全部" + MODES[mode].cn + "张" : "生成" + MODES[mode].label);
    dlAll.disabled = !anyImg;
    clearBtn.disabled = anyBusy;
    Array.prototype.forEach.call($("seg").querySelectorAll("button"), function(b){ b.disabled = anyBusy; });
  }

  // ---------- 生成 ----------
  function dataUrlToBlob(d){
    var parts = d.split(","), mime = parts[0].match(/:(.*?);/)[1], bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  // 返回 Promise；单张失败不影响其它张
  function generateView(v){
    if(v.busy || !state.dataUrl) return Promise.resolve();
    v.busy = true;
    setViewErr(v, "");
    var t0 = performance.now();
    v.el.secs.textContent = "0.0 秒";
    v.timer = setInterval(function(){
      v.el.secs.textContent = ((performance.now()-t0)/1000).toFixed(1) + " 秒";
    }, 100);
    render(v);

    // 非前视图：同时带上当前的前视图作为第二张参考，保证六张是同一件产品
    var front = VIEWS[0];
    var useAnchor = v.key !== "front" && front.cur >= 0;
    var fd = new FormData();
    fd.append("image", dataUrlToBlob(state.dataUrl), "reference.jpg");
    if(useAnchor) fd.append("anchor", dataUrlToBlob(front.versions[front.cur]), "front.png");
    fd.append("prompt", buildPrompt(v, useAnchor));
    fd.append("size", SIZE);

    return fetch(API + "/api/generate", { method:"POST", body: fd })
      .then(function(r){
        return r.text().then(function(t){
          var data = null;
          try { data = JSON.parse(t); } catch(e){}
          if(!r.ok) throw new Error((data && data.error) || ("服务返回 " + r.status));
          if(!data || !data.image) throw new Error("服务没有返回图片");
          return data;
        });
      })
      .then(function(data){
        v.versions.push(data.image);
        v.qas.push({ state:"wait", issues:[], hard:(data.flags || []).map(function(f){ return f.text; }) });
        v.cur = v.versions.length - 1;      // 新图自动显示，旧版本留在切换按钮里
        runCheck(v, v.versions.length - 1); // 后台质检，不阻塞
      })
      .catch(function(err){
        var msg = err && err.message ? err.message : String(err);
        if(/Failed to fetch|NetworkError|Load failed/i.test(msg)){
          msg = "连不上本地服务。请确认「启动.bat」的黑窗口还开着，然后刷新页面。";
        }
        setViewErr(v, msg);                 // 旧版本不丢
      })
      .then(function(){
        clearInterval(v.timer); v.timer = null;
        v.busy = false;
        render(v);
      });
  }

  // 质检：看图模型对照原图，找设计上的不一致（只提示，不拦截）
  function runCheck(v, idx){
    var q = v.qas[idx], url = v.versions[idx];
    var fd = new FormData();
    fd.append("image", dataUrlToBlob(state.dataUrl), "reference.jpg");
    fd.append("generated", dataUrlToBlob(url), "gen.png");
    fd.append("view", v.name + " (" + v.en + ")");
    fetch(API + "/api/check", { method:"POST", body: fd })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ q.state = "na"; }
        else { q.state = d.match ? "ok" : "warn"; q.issues = d.issues || []; }
      })
      .catch(function(){ q.state = "na"; })
      .then(function(){
        // 服务端硬校验（透明底/重复视图）不依赖模型，优先级最高，不会被质检模型的「没问题」盖掉
        if(q.hard && q.hard.length){ q.state = "warn"; q.issues = q.hard.concat(q.issues || []); }
        render(v);
      });
  }

  // 产品档案：先让看图模型把原图的事实写下来，之后所有视图共用
  var specSrc = null;       // 当前档案对应哪张图
  function ensureSpec(){
    if(!state.dataUrl) return Promise.resolve();
    if(specSrc === state.dataUrl) return Promise.resolve();
    var specEl = $("spec"), st = $("specState");
    st.textContent = "正在读图提取…";
    var fd = new FormData();
    fd.append("image", dataUrlToBlob(state.dataUrl), "reference.jpg");
    var mine = state.dataUrl;
    return fetch(API + "/api/analyze", { method:"POST", body: fd })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error) throw new Error(d.error);
        specEl.value = d.spec; specSrc = mine;
        st.textContent = "已提取，可修改";
      })
      .catch(function(){
        st.textContent = "提取失败，将不带档案生成（可手填）";
      });
  }
  $("spec").addEventListener("input", function(){ $("specState").textContent = "已手动修改"; });

  // 并发队列：同时最多 CONCURRENCY 张
  function generateAll(){
    if(!state.dataUrl) return;
    var front = VIEWS[0];
    var rest = activeViews().slice(1).filter(function(v){ return !v.busy; });
    var total = rest.length + (front.busy ? 0 : 1), done = 0;
    genAll.disabled = true; genAll.textContent = "生成中…";
    genNote.textContent = "第 1 步：读图建立产品档案…";

    ensureSpec().then(function(){
      genNote.textContent = "第 2 步：先生成前视图作为基准…";
      return front.busy ? Promise.resolve() : generateView(front);
    }).then(function(){
      if(!front.busy && !front.versions.length){ /* 前视图失败：其余仍用原图单独生成 */ }
      done = front.busy ? 0 : 1;
      genNote.textContent = "第 3 步：以前视图为基准生成其余 " + rest.length + " 张（" + done + " / " + total + "）";
      var queue = rest.slice();
      function worker(){
        var v = queue.shift();
        if(!v) return Promise.resolve();
        return generateView(v).then(function(){
          done++; genNote.textContent = "第 3 步：已完成 " + done + " / " + total;
          return worker();
        });
      }
      var ws = [];
      for(var i=0;i<Math.min(CONCURRENCY, queue.length);i++) ws.push(worker());
      return Promise.all(ws);
    }).then(function(){
      var failed = activeViews().filter(function(v){ return v.el.err.classList.contains("show"); }).length;
      var warn = activeViews().filter(function(v){ var q = v.qas[v.cur]; return q && q.state === "warn"; }).length;
      genNote.textContent = failed ? ("有 " + failed + " 张失败，点对应方框重试") :
        (warn ? ("全部完成；" + warn + " 张被质检标了 ⚠，建议重生成") : (MODES[mode].cn + "张全部完成，不满意的可单独重生成"));
      refreshGlobal();
    });
  }

  // ---------- 下载 ----------
  function fileStamp(){ return new Date().toISOString().slice(0,10).replace(/-/g,""); }
  function downloadView(v){
    if(v.cur < 0) return;
    var a = document.createElement("a");
    a.download = "贝贝生图_" + v.name + "_第" + (v.cur+1) + "次_" + fileStamp() + ".png";
    a.href = v.versions[v.cur];
    document.body.appendChild(a); a.click(); a.remove();
  }
  function downloadAll(){
    var list = activeViews().filter(function(v){ return v.cur >= 0; });
    list.forEach(function(v, i){ setTimeout(function(){ downloadView(v); }, i * 350); });
  }

  // ---------- 上传 ----------
  function setNote(t){ genNote.textContent = t || ""; }
  function showErr(msg){ errBox.textContent = msg || ""; errBox.classList.toggle("show", !!msg); }

  function loadFile(f){
    if(!f) return;
    if(!/^image\//.test(f.type)){ setNote("请上传图片文件"); return; }
    if(f.size > 30*1048576){ setNote("图片超过 30MB，请先压缩"); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
        var cv = document.createElement("canvas");
        cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        state.dataUrl = cv.toDataURL("image/jpeg", 0.95);
        state.file = f;
        specSrc = null; $("spec").value = ""; $("specState").textContent = "上传后自动提取";

        drop.classList.add("has");
        dropInner.style.display = "none";
        var pv = drop.querySelector("img");
        if(!pv){ pv = document.createElement("img"); drop.appendChild(pv); }
        pv.src = state.dataUrl;
        clearBtn.style.display = "grid";
        fileName.textContent = f.name.length > 22 ? f.name.slice(0,19)+"…" : f.name;
        fileInfo.textContent = w + " × " + h;
        showErr("");
        setNote(activeViews().some(function(v){return v.cur>=0;})
          ? "已换了参考图。之后生成的新版本会基于这张新图"
          : ("图片已就绪，点「生成" + MODES[mode].label + "」"));
        VIEWS.forEach(render);
      };
      img.onerror = function(){ setNote("这张图片读不出来，换一张试试"); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  }

  function resetUpload(){
    state.file = null; state.dataUrl = null;
    var pv = drop.querySelector("img"); if(pv) pv.remove();
    drop.classList.remove("has");
    dropInner.style.display = "block";
    clearBtn.style.display = "none";
    fileName.textContent = ""; fileInfo.textContent = ""; fileInput.value = "";
    setNote("请先上传一张饰品图片");
    VIEWS.forEach(render);          // 已生成的图和历史版本保留
  }

  // ---------- 健康检查 ----------
  function checkStatus(){
    dot.className = "dot wait"; statusText.textContent = "正在连接…"; retryStatus.style.display = "none";
    fetch(API + "/api/health", { cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.ok){ dot.className = "dot ok"; statusText.textContent = "接口正常"; showErr(""); }
        else{
          dot.className = "dot err"; statusText.textContent = "接口异常"; retryStatus.style.display = "inline";
          showErr("接口连接失败：" + (d.detail || "未知原因") + "\n\n请把这段信息发给技术。");
        }
      })
      .catch(function(){
        dot.className = "dot err"; statusText.textContent = "未连上本地服务"; retryStatus.style.display = "inline";
        showErr("没有连上本地服务。\n\n请双击「启动.bat」，用它自动打开的页面操作。");
      });
  }

  // ---------- 事件 ----------
  drop.addEventListener("click", function(e){ if(e.target === clearBtn) return; if(!state.file) fileInput.click(); });
  clearBtn.addEventListener("click", function(e){ e.stopPropagation(); resetUpload(); });
  fileInput.addEventListener("change", function(e){ if(e.target.files && e.target.files[0]) loadFile(e.target.files[0]); });
  ["dragenter","dragover"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); drop.classList.add("dragover"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); drop.classList.remove("dragover"); });
  });
  drop.addEventListener("drop", function(e){
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(f) loadFile(f);
  });
  ["dragover","drop"].forEach(function(ev){ window.addEventListener(ev, function(e){ e.preventDefault(); }); });
  document.addEventListener("paste", function(e){
    var items = e.clipboardData && e.clipboardData.items; if(!items) return;
    for(var i=0;i<items.length;i++){
      if(items[i].type.indexOf("image") === 0){ loadFile(items[i].getAsFile()); break; }
    }
  });

  genAll.addEventListener("click", generateAll);
  dlAll.addEventListener("click", downloadAll);
  retryStatus.addEventListener("click", checkStatus);

  Array.prototype.forEach.call($("seg").querySelectorAll("button"), function(b){
    b.addEventListener("click", function(){
      if(VIEWS.some(function(v){ return v.busy; })) return;
      mode = +b.getAttribute("data-mode");
      applyMode();        // 已生成的图和历史版本都保留，切回去还在
    });
  });

  VIEWS.forEach(render);
  applyMode();
  checkStatus();
})();
</script>
</body>
</html>
